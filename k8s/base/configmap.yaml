apiVersion: v1
kind: ConfigMap
metadata:
  name: estoque-config
  namespace: oficina-estoque
data:
  AWS_REGION: us-east-1
  # Sobrescritos pelo overlay com os outputs do Terraform do serviço.
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: estoque
  POSTGRES_DB: oficina_estoque
  ESTOQUE_EVENTS_TOPIC_ARN: ""
  ESTOQUE_COMMANDS_QUEUE_URL: ""
  ESTOQUE_CATALOG_EVENTS_QUEUE_URL: ""
  ADMIN_USERNAME: admin
  JWT_ALGORITHM: HS256
  LOG_LEVEL: INFO
  # ADR-0007: só ativa de fato com NEW_RELIC_LICENSE_KEY (secret) definida.
  NEW_RELIC_APP_NAME: oficina-mecanica-estoque
  NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
