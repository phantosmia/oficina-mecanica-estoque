# Worker: consome as filas da saga e de eventos do Catálogo. Pode ter mais de
# uma réplica com segurança (idempotência por message_id e reserva única por
# saga), mas uma basta para o volume da oficina.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: estoque-worker
  namespace: oficina-estoque
  labels:
    app.kubernetes.io/name: estoque-worker
    app.kubernetes.io/part-of: oficina-mecanica
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: estoque-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: estoque-worker
        app.kubernetes.io/part-of: oficina-mecanica
    spec:
      containers:
        - name: worker
          image: oficina-mecanica-estoque:latest
          imagePullPolicy: Always
          args: ["worker"]
          envFrom:
            - configMapRef:
                name: estoque-config
            - secretRef:
                name: estoque-secret
          env:
            - name: NEW_RELIC_APP_NAME
              value: oficina-mecanica-estoque-worker
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
